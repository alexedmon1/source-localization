name: tests

# Run the fast test suite on every push and PR.
#
# `-m "not slow"` excludes the tests marked slow in pyproject (real BEM and
# forward builds across every preset and atlas: minutes each). Those still
# run locally with `pytest -m slow`. The 257 fast tests take ~10 s warm; the
# two anatomical-surface tests rebuild the mid-ribbon mesh when the cache is
# cold, which is why the surface cache is restored between runs.
#
# Headless: pyvista/VTK is used for mesh extraction, not rendering, and
# matplotlib figures are written to files. Both env vars keep them from
# looking for a display.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYVISTA_OFF_SCREEN: "true"
  MPLBACKEND: Agg

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore anatomical surface cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/source-localization/surfaces
          key: surfaces-${{ hashFiles('src/source_localization/source_space/surface_anatomical.py', 'src/source_localization/data/atlas/allen/allen_labels.nii.gz') }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Test
        run: uv run --no-sync pytest tests -m "not slow" -q --deselect tests/test_psd_sanity.py
