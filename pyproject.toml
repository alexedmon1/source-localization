[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source_localization"
version = "0.8.0"
description = "Mouse EEG source localization pipeline"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Alex Lexy", email = "metalexy@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "mne>=1.5.0",
    "nibabel>=3.2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "pyvista>=0.38.0",
    "eeglabio>=0.1.2",
    # Imported by source_space/roi_based.py (PCA, KMeans). Undeclared until
    # v0.4.1, so a clean install from this file failed at source-space
    # construction; earlier runs masked it with `uv run --with scikit-learn`.
    "scikit-learn>=1.0",
    # Imported opportunistically (inside try/except) by
    # source_analysis/visualization_roi.py and utils/electrode_registration.py,
    # and required outright by the anatomical surface source space, which
    # extracts a cortical isosurface with skimage.measure.marching_cubes.
    "scikit-image>=0.19",
]

[project.optional-dependencies]
connectivity = [
    "mne-connectivity>=0.6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.0.200",
]
# The shared results specification (neurobox-dev): `study qc` also writes the
# study's localization summary (analysis.json, recordings.csv, parcel_coverage.csv).
# neurobox-dev needs Python 3.10+; on 3.9 the extra installs nothing.
results = [
    "neurobox-dev @ git+https://github.com/alexedmon1/neurobox-dev@4333c6a4dcbf13a82d27c456a52aebdf1c7d559d ; python_version >= '3.10'",
]
all = [
    "mne-connectivity>=0.6.0",
    "neurobox-dev @ git+https://github.com/alexedmon1/neurobox-dev@4333c6a4dcbf13a82d27c456a52aebdf1c7d559d ; python_version >= '3.10'",
]

[project.scripts]
source-localization = "source_localization.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
source_localization = [
    "config/*.yaml",
    "config/presets/*.yaml",
    "data/atlas/*",
    "data/electrodes/*",
    "data/calibration/*",
    "validation/config/default_tests/**/*.yaml",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
markers = [
    "slow: builds real geometry; minutes uncached",
]
