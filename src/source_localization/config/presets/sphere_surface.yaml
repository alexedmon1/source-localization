pipeline:
  name: "Spherical BEM + Surface Sources"
  bem_type: sphere
  source_type: surface

inputs:
  brain_volume: "data/atlas/Atlas_3DRois.nii"
  brain_labels: "data/atlas/Atlas_3DRoisLeftRight.Labels.nii"
  roi_mapping: "data/atlas/roi_mapping.json"
  electrodes_csv: "data/electrodes/mouse_array_coords.csv"
  eeg_file: null

electrode:
  projection_method: "intensity"  # 'intensity', 'rbf', or 'none'
  skull_offset_mm: 0.0  # Distance from skull surface (0.0 = at surface)
  bregma_vox: [30, 149, 41]  # Bregma voxel coordinates (0-indexed) for validation
  lambda_vox: [30, 97, 41]  # Lambda voxel coordinates (0-indexed) for validation
  create_visualization: true  # Create electrode registration visualization

bem:
  sphere:
    n_layers: 3
    conductivities: [0.33, 0.0042, 0.33]
    radii_ratios: [0.87, 0.92, 1.0]
    electrode_centered: true  # Position sphere with top at brain surface, centered under electrodes
    brain_radius_mm: null  # Auto-compute from brain extent
    use_cache: true
    force_recreate: false
    compute_method: analytical

source_space:
  surface:
    # Explicitly the icosphere. The default is now `anatomical` (D36), but the
    # sphere BEM does not contain the anatomical surface: measured, 638 of 2,546
    # sources (25.1%) fall outside its inner skull and MNE drops them from the
    # forward silently (X40). That is the same defect 868dea9 fixed for the
    # ellipsoid by extending it, and no equivalent fit has been derived for the
    # sphere. Until one is, this preset keeps the geometric surface it has always
    # had -- which also preserves the icosphere comparator Phase 3's
    # anatomy-vs-radial contrast is built on.
    method: icosphere
    ico_level: 3  # Icosahedral subdivision level (3 = 642 vertices, ~290 after dorsal filtering)
    inset_factor: 0.85  # Sources at 85% of brain radius (ensures interior placement)
    filter_dorsal: true  # Filter to dorsal hemisphere only (Z > center) for better conditioning

forward:
  meg: false
  eeg: true
  mindist: 0.0

inverse:
  method: sLORETA  # Recommended: sLORETA for best localization accuracy
  snr: 3.0
  lambda2: null
  depth_weighting: 0.8

spectral:
  frequency_bands:
    delta: [1, 4]
    theta: [4, 10]
    alpha: [10, 13]
    beta: [13, 30]
    low_gamma: [30, 55]
    high_gamma: [65, 100]
  primary_band: low_gamma

roi:
  use_proximity: false  # nearest-voxel atlas lookup; see ADR below
  proximity_radius_mm: 2.0

outputs:
  dir: "outputs/sphere_surface"
  save_intermediate: true
  figure_format: png
  figure_dpi: 100
  # Signed only. The magnitude variant duplicates the signed one at roughly
  # 1 GB per subject on full-length recordings, and every deployed study
  # already overrides this key to "signed" by hand (FORGE disease, treatment
  # and the WP-14 arms all do). Making it the default stops that override
  # being something a study has to remember. Set to "both" if a downstream
  # analysis genuinely wants rectified amplitudes.
  output_variants: "signed"
